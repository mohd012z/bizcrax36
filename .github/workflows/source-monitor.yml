name: Public source monitoring (unverified)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect public source availability
        run: |
          mkdir -p data
          python -m backend.source_monitor --output data/source-monitor.json
      - name: Preserve evidence snapshot even if sources fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-source-snapshot
          path: data/source-monitor.json
          if-no-files-found: warn
          retention-days: 14
