name: BizCrax36 P1 tests
on:
  push:
    branches: [main, feature/opportunity-research-p1, feat/agentic-research-v2]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned hybrid dependency
        run: python -m pip install -r requirements-hybrid.txt
      - name: Run full offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q backend tests
