name: BizCrax36 webhook tests
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'tests/telegram_webhook.test.mjs'
      - '.github/workflows/webhook-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: node --check worker/telegram-webhook.mjs
      - name: Run webhook tests
        run: node --test tests/telegram_webhook.test.mjs
