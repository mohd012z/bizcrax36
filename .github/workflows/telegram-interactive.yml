name: BizCrax36 Telegram interactive menu
on:
  push:
    branches: [main]
    paths:
      - 'backend/telegram_poll_once.py'
      - 'backend/telegram_bot.py'
      - 'backend/agent_skill.py'
      - 'backend/telegram_menu.py'
      - 'backend/telegram_poll_continuous.py'
      - 'backend/agentic_research.py'
      - 'backend/research_v2.py'
      - 'backend/research_queue.py'
      - 'backend/dossier.py'
      - 'backend/reports.py'
      - 'backend/news_agent.py'
      - 'backend/evidence_sources.py'
      - 'backend/llm_endpoints.py'
      - 'backend/ai_bizcollector.py'
      - 'tests/test_news_agent.py'
      - 'tests/test_evidence_sources.py'
      - 'tests/test_llm_endpoints.py'
      - '.github/workflows/telegram-interactive.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
concurrency:
  group: bizcrax36-telegram-updates
  cancel-in-progress: false
jobs:
  # Scheduled + manual runs: poll FIRST so queued button presses are picked up
  # as soon as the runner is up (no test-suite pre-flight on the hot path).
  process-updates:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Python runtime
        run: python3 --version
      - name: Process pending Telegram messages and button clicks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINDA_BASE_URL: ${{ secrets.MINDA_BASE_URL }}
          MINDA_API_KEY: ${{ secrets.MINDA_API_KEY }}
          MINDA_MODEL: ${{ secrets.MINDA_MODEL }}
          LLM_PROXY_BASE_URL: ${{ secrets.LLM_PROXY_BASE_URL }}
          LLM_PROXY_API_KEY: ${{ secrets.LLM_PROXY_API_KEY }}
          LLM_PROXY_MODEL: ${{ secrets.LLM_PROXY_MODEL }}
        run: python3 -m backend.telegram_poll_once
      - name: Regression tests after the poll (proves the run that answered is healthy)
        continue-on-error: true
        run: python3 -m unittest discover -s tests -v
  # Code pushes: full test gate before anything runs against main.
  tests-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Python runtime
        run: python3 --version
      - name: Run full regression suite
        env:
          MINDA_BASE_URL: ${{ secrets.MINDA_BASE_URL }}
          MINDA_API_KEY: ${{ secrets.MINDA_API_KEY }}
          MINDA_MODEL: ${{ secrets.MINDA_MODEL }}
        run: python3 -m unittest discover -s tests -v
