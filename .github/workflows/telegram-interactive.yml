name: BizCrax36 Telegram interactive menu
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: bizcrax36-telegram-updates
  cancel-in-progress: false
jobs:
  process-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check Python runtime
        run: python3 --version
      - name: Process pending Telegram messages and button clicks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m backend.telegram_poll_once
