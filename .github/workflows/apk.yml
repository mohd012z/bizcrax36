name: BizCrax36 APK (backup shell)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/index.html'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run engine regression tests (web UI depends on the API contract)
        run: python -m unittest discover -s tests -v
      - name: Sync web UI into APK assets
        run: cp web/index.html android/app/src/main/assets/web/index.html
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bizcrax36-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
