name: BizCrax36 agentic research
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Business topic to investigate"
        required: true
        type: string
      chat_id:
        description: "Telegram chat ID for queued research delivery"
        required: false
        type: string
      request_id:
        description: "Queue request identifier"
        required: false
        type: string
      country:
        description: "Country"
        required: false
        default: Malaysia
        type: string
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest tests.test_agentic_research -v
      - name: Discover candidate leads
        env:
          RESEARCH_QUERY: ${{ inputs.query }}
          RESEARCH_COUNTRY: ${{ inputs.country }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import json
          from backend.agentic_research import research
          output = research(os.environ["RESEARCH_QUERY"], os.environ.get("RESEARCH_COUNTRY") or "Malaysia")
          path = Path("agentic-research-result.json")
          path.write_text(json.dumps(output, indent=2, ensure_ascii=False), encoding="utf-8")
          print("Candidates:", len(output["candidates"]), "Source errors:", len(output["errors"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-research-result
          path: agentic-research-result.json
          retention-days: 7
      - name: Deliver queued research to Telegram
        if: ${{ inputs.chat_id != '' && inputs.request_id != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          result=json.loads(Path("agentic-research-result.json").read_text())
          rows=result.get("candidates",[])[:5]
          lines=["Research result: "+result["plan"]["query"],"Request ID: "+os.environ["REQUEST_ID"]]
          for i,row in enumerate(rows,1):
              lines.extend([f"{i}. {row['title']}",row["source_url"],"Status: REVIEW_REQUIRED"])
          if not rows: lines.append("No candidates found. Source availability may be limited.")
          lines.append("News leads only; no opportunity or profitability has been independently verified.")
          payload=json.dumps({"chat_id":os.environ["TELEGRAM_CHAT_ID"],"text":"\\n".join(lines)[:3900]}).encode()
          req=urllib.request.Request("https://api.telegram.org/bot"+os.environ["TELEGRAM_BOT_TOKEN"]+"/sendMessage",data=payload,headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=30) as response:
              print("Telegram delivery HTTP",response.status)
          PY
