name: Railway polling tests
on:
  pull_request:
  push:
    branches: [feat/railway-telegram-polling]
permissions:
  contents: read
jobs:
  polling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest tests.test_telegram_polling -v
      - run: python3 -m py_compile hosting/telegram_polling.py
