<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="./manifest.webmanifest"><title>BizCrax36 Operations</title><style>body{margin:0;background:#0b1220;color:#e5edf7;font:16px system-ui;padding:16px;max-width:780px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}section{background:#17243a;padding:16px;border-radius:12px;margin:12px 0}button{padding:12px;border-radius:8px;background:#2a496f;color:white;border:1px solid #6683a7}button:focus-visible{outline:3px solid #ffcc66}small{color:#a8b9cc}pre{white-space:pre-wrap;overflow-wrap:anywhere}#status{color:#ffd18b}nav{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><header><h1>BizCrax36 Ops</h1><small id="status" role="status">Offline · No live data</small></header><nav aria-label="Dashboard sections"><a href="#queue">Queue</a><a href="#jobs">Jobs</a><a href="#logs">Logs</a><a href="#quotas">Quotas</a></nav><section id="queue"><h2>Queue depth</h2><strong id="depth">—</strong></section><section id="jobs"><h2>Jobs</h2><pre id="jobdata">No authenticated snapshot</pre></section><section id="logs"><h2>Errors</h2><pre id="logdata">No authenticated snapshot</pre></section><section id="quotas"><h2>Quotas</h2><pre id="quotadata">No authenticated snapshot</pre></section><section><h2>Recovery actions</h2><p>Disabled until authenticated backend, CSRF and database recovery gates pass.</p><button disabled>Retry</button> <button disabled>Resume</button> <button disabled>Reclaim</button></section><script>const statusEl=document.getElementById('status');let active=true;async function refresh(){if(!active||document.hidden)return;try{const c=new AbortController();const timeout=setTimeout(()=>c.abort(),8000);let r;try{r=await fetch('/api/ops/snapshot',{credentials:'same-origin',cache:'no-store',signal:c.signal})}finally{clearTimeout(timeout)}if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!d||!Array.isArray(d.jobs)||!Array.isArray(d.logs)||!Array.isArray(d.quotas))throw Error('Invalid snapshot');document.getElementById('depth').textContent=String(d.counts?.queued??d.jobs.filter(x=>x.status==='queued').length);for(const [id,value] of [['jobdata',d.jobs],['logdata',d.logs],['quotadata',d.quotas]])document.getElementById(id).textContent=JSON.stringify(value.slice(0,50),null,2);statusEl.textContent='Connected · '+new Date().toLocaleTimeString()}catch(e){statusEl.textContent='Unavailable · '+e.message}}document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(refresh,60000);refresh();</script></body></html>
